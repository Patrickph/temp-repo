name: Collect product images

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: product-image-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests pillow playwright
          python -m playwright install --with-deps chromium

      - name: Collect images
        run: python collect_marketplace_fast.py

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-images-marketplaces
          path: product-images-marketplaces.zip
          retention-days: 7

      - name: Upload manifest preview
        uses: actions/upload-artifact@v4
        with:
          name: product-images-marketplaces-manifest
          path: |
            output/manifest.csv
            output/manifest.json
            output/resumo.json
            output/LEIA-ME.txt
          retention-days: 7
